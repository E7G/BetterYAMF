name: Build BetterYAMF Test APK

on:
  push:
    branches:
      - perf/native-window-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Start local Maven bridge
        shell: bash
        run: |
          cat > /tmp/maven-bridge.js <<'JS'
          const http = require('http');
          const { Readable } = require('stream');

          const routes = {
            google: 'https://dl.google.com/dl/android/maven2/',
            central: 'https://repo.maven.apache.org/maven2/',
            plugins: 'https://plugins.gradle.org/m2/',
            jitpack: 'https://jitpack.io/',
            xposed: 'https://api.xposed.info/',
            mvnrepo: 'https://mvnrepository.com/artifact/'
          };

          const server = http.createServer(async (req, res) => {
            try {
              const parsed = new URL(req.url, 'http://127.0.0.1');
              const parts = parsed.pathname.split('/').filter(Boolean);
              const key = parts.shift();
              const base = routes[key];
              if (!base) {
                res.writeHead(404);
                return res.end('unknown repository');
              }
              const target = base + parts.join('/') + parsed.search;
              console.log(`${req.method} ${target}`);
              const upstream = await fetch(target, {
                method: req.method === 'HEAD' ? 'HEAD' : 'GET',
                redirect: 'follow',
                headers: { 'user-agent': 'BetterYAMF-CI-MavenBridge/1.0' }
              });
              const headers = {};
              for (const [k, v] of upstream.headers.entries()) {
                if (!['connection', 'transfer-encoding', 'content-encoding'].includes(k.toLowerCase())) {
                  headers[k] = v;
                }
              }
              res.writeHead(upstream.status, headers);
              if (req.method === 'HEAD' || !upstream.body) return res.end();
              Readable.fromWeb(upstream.body).pipe(res);
            } catch (e) {
              console.error(e);
              if (!res.headersSent) res.writeHead(502);
              res.end(String(e));
            }
          });

          server.listen(39000, '127.0.0.1', () => console.log('Maven bridge listening on 39000'));
          JS

          node -e "fetch('https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.9.3/gradle-8.9.3.pom').then(r=>{console.log('Node Google Maven probe:',r.status); if(!r.ok) process.exit(2)}).catch(e=>{console.error(e); process.exit(3)})"
          nohup node /tmp/maven-bridge.js >/tmp/maven-bridge.log 2>&1 &
          echo $! >/tmp/maven-bridge.pid
          sleep 1
          cat /tmp/maven-bridge.log

      - name: Route Gradle repositories through local bridge
        shell: bash
        run: |
          cp settings.gradle.kts /tmp/settings.gradle.kts.original
          cat > settings.gradle.kts <<'EOF'
          @file:Suppress("UnstableApiUsage")

          pluginManagement {
              repositories {
                  maven("http://127.0.0.1:39000/google") { isAllowInsecureProtocol = true }
                  maven("http://127.0.0.1:39000/central") { isAllowInsecureProtocol = true }
                  maven("http://127.0.0.1:39000/plugins") { isAllowInsecureProtocol = true }
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  maven("http://127.0.0.1:39000/google") { isAllowInsecureProtocol = true }
                  maven("http://127.0.0.1:39000/central") { isAllowInsecureProtocol = true }
                  maven("http://127.0.0.1:39000/jitpack") { isAllowInsecureProtocol = true }
                  maven("http://127.0.0.1:39000/xposed") { isAllowInsecureProtocol = true }
                  maven("http://127.0.0.1:39000/mvnrepo") { isAllowInsecureProtocol = true }
              }
          }

          rootProject.name = "BetterYAMF"
          include(":app", ":android-stub")
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Show Maven bridge log on failure
        if: failure()
        run: tail -n 200 /tmp/maven-bridge.log || true

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/BetterYAMF-native-window-ux-debug.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BetterYAMF-native-window-ux-debug
          path: out/*
          if-no-files-found: error
          retention-days: 14
